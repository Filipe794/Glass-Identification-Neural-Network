# =============================================================================
# R5 - Agrupamento de classes (rodada exploratória; não escolhe vencedor)
# -----------------------------------------------------------------------------
# Pergunta: como o desbalanceamento e o tamanho das classes afetam a rede? O que acontece
#           quando o problema vira binário?
#   window_vs_other    janela (classes 1, 2, 3) x não janela (5, 6, 7)
#   float_vs_nonfloat  só janelas: float (1 e 3) x não float (2). É a tarefa do estudo
#                      original citado na página da UCI (Evett e Spiehler, 1987)
# Objetivo: contrastar com o problema de 6 classes usando a MESMA rede (vencedora do R4).
#           Não entra na escolha do modelo final: é outro problema.
# Atenção: as notas dos três alvos NÃO são comparáveis entre si (problemas e amostras
#          diferentes; o float_vs_nonfloat descarta as classes 5, 6 e 7). O compare.py recusa
#          comparar alvos diferentes. Leia cada resultado no seu próprio problema e use a
#          matriz de confusão e o balanced_accuracy para a discussão.
#   python summarize.py     (a coluna "target" separa os problemas)
#
# Experimentos de apoio, por alvo (acrescentados em 10/11/2026):
#   *_dummy               piso: classe majoritária no próprio problema. Sem ele, os números
#                         binários não têm referência (no treino, janela x outros = 130 x 40,
#                         piso de acurácia ≈ 76%; float x não float = 69 x 61, piso ≈ 53%).
#                         Usa balancing none: com random_over as classes empatam no treino e o
#                         most_frequent deixaria de ser o piso real.
#   *_logreg              regressão logística balanceada: a rede ainda acrescenta algo quando o
#                         problema vira binário, ou um modelo linear já basta?
#   *_sem_reamostragem    a mesma rede sem random_over: o ganho da reamostragem depende do grau
#                         de desbalanceamento (76/24 x 53/47)?
# Comparar por alvo (o prefixo filtra o problema; o compare.py recusa misturar alvos):
#   python compare.py --rodada R5_janela --salvar
#   python compare.py --rodada R5_janela --metric balanced_accuracy --salvar
#   python compare.py --rodada R5_janela --metric accuracy --salvar
#   python tabela_rodada.py --rodada R5_janela
#
#   python compare.py --rodada R5_float --salvar
#   python compare.py --rodada R5_float --metric balanced_accuracy --salvar
#   python compare.py --rodada R5_float --metric accuracy --salvar
#   python tabela_rodada.py --rodada R5_float
#
# Atualizado em 10/11/2026: baseline = vencedor do R4 (standard, random_over, [32], tanh, adam,
# alpha = 1). Ele roda como R5_baseline no problema de 6 classes (é pulado pelo hash: é a mesma
# config do vencedor do R4) e serve só de referência de leitura.
# =============================================================================

baseline_name: R5_baseline

baseline:
  scaler: standard                            # vencedor de R1
  selection: none
  balancing: random_over                        # vencedor de R4
  model: {name: mlp, hidden_layer_sizes: [32], activation: tanh, alpha: 1}  # vencedores de R2 e R3

experiments:
  - name: R5_janela_vs_outros
    override: {target: window_vs_other}

  - name: R5_float_vs_nao_float
    override: {target: float_vs_nonfloat}

  # Pisos por alvo (balancing none: com random_over o most_frequent deixa de ser o piso)
  - name: R5_janela_dummy
    override: {target: window_vs_other, balancing: none, model: {name: dummy, strategy: most_frequent}}
  - name: R5_float_dummy
    override: {target: float_vs_nonfloat, balancing: none, model: {name: dummy, strategy: most_frequent}}

  # Modelo linear por alvo
  - name: R5_janela_logreg
    override: {target: window_vs_other, balancing: none, model: {name: logreg, class_weight: balanced}}
  - name: R5_float_logreg
    override: {target: float_vs_nonfloat, balancing: none, model: {name: logreg, class_weight: balanced}}

  # Rede sem reamostragem por alvo
  - name: R5_janela_sem_reamostragem
    override: {target: window_vs_other, balancing: none}
  - name: R5_float_sem_reamostragem
    override: {target: float_vs_nonfloat, balancing: none}
